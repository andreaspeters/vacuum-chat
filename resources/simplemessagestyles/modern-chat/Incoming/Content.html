<table class="xxxwrapper %messageClasses%" width="100%" cellpadding="0" cellspacing="0" border="0" align="left">
  <tr>
    <td class="xxxavatar" width="36" rowspan="2" valign="bottom"><img width="36" src="%userIconPath%" alt="" /></td>
    <td class="xxxsender" colspan="2">%sender%&nbsp;&nbsp;<span class="xxxtime">%shortTime%</span></td>
  </tr>
  <tr>
    <td class="xxxmessageHost" align="left"><table class="xxxbubble" cellpadding="0" cellspacing="0" border="0">
      <tr><td class="xxxbubblecorner" width="6" height="6"></td><td class="xxxbubblefill"></td><td class="xxxbubblecorner" width="6" height="6"></td></tr>
      <tr><td class="xxxbubblefill"></td><td class="xxxmessage">%message%</td><td class="xxxbubblefill"></td></tr>
      <tr><td class="xxxbubblecorner" width="6" height="6"></td><td class="xxxbubblefill"></td><td class="xxxbubblecorner" width="6" height="6"></td></tr>
    </table></td>
    <td width="20%"></td>
  </tr>
</table>
